<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Google Docs</title>
    <link rel="icon" href="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
      }

      #gameContainer {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background: #000 !important;
      }

      #gameContainer canvas {
        width: 100vw !important;
        height: 100vh !important;
        display: block;
        outline: none;
        object-fit: fill !important;
      }

      #hud-bar {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 8px;
        z-index: 999999;
        opacity: 0.45;
        transition: opacity 0.2s ease;
      }

      #hud-bar:hover {
        opacity: 1;
      }

      .hud-btn {
        background-color: #111;
        color: #fff;
        border: 2px solid #ff9900;
        font-size: 11px;
        font-family: 'Audiowide', sans-serif;
        padding: 6px 12px;
        cursor: pointer;
        border-radius: 6px;
        letter-spacing: 0.8px;
        box-shadow: 0 0 8px rgba(255, 153, 0, 0.4);
        transition: all 0.25s ease;
      }

      .hud-btn:hover {
        background-image: linear-gradient(270deg, red, orange, yellow);
        background-size: 300% 300%;
        animation: fireInside 3s linear infinite;
        color: #fff;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
        box-shadow: inset 0 0 10px rgba(255, 165, 0, 0.4), 0 0 14px #ff9900;
      }

      .hud-btn:active {
        transform: scale(0.96);
      }

      @keyframes fireInside {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      #loader-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.92);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #ffffff;
        z-index: 20;
        transition: opacity 0.35s ease;
        padding: 20px;
        text-align: center;
      }

      #loader-title {
        font-family: 'Audiowide', sans-serif;
        font-size: 30px;
        letter-spacing: 2px;
        color: #ff9900;
        text-shadow: 0 0 12px rgba(255, 153, 0, 0.5);
        margin-bottom: 6px;
      }

      #loader-sub {
        font-size: 13px;
        color: #9ca3af;
        margin-bottom: 22px;
      }

      #progress-track {
        width: min(440px, 84vw);
        height: 14px;
        background: #1a1a1a;
        border: 2px solid #ff9900;
        border-radius: 999px;
        overflow: hidden;
        box-shadow: 0 0 12px rgba(255, 153, 0, 0.3);
      }

      #progress-fill {
        width: 0%;
        height: 100%;
        background-image: linear-gradient(270deg, red, orange, yellow);
        background-size: 300% 300%;
        animation: fireInside 3s linear infinite;
        transition: width 0.12s ease-out;
      }

      #loader-status {
        margin-top: 10px;
        font-size: 12px;
        font-family: monospace;
        color: #d1d5db;
      }

      #error-box {
        display: none;
        margin-top: 14px;
        padding: 12px 16px;
        max-width: min(500px, 88vw);
        background: #dc2626;
        color: #fff;
        border-radius: 8px;
        font-size: 13px;
        text-align: center;
        line-height: 1.4;
      }

      #retry-btn {
        display: none;
        margin-top: 10px;
        background: #ff9900;
        color: #000;
        border: none;
        border-radius: 6px;
        padding: 7px 14px;
        font-family: 'Audiowide', sans-serif;
        font-size: 11px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="hud-bar">
      <button class="hud-btn" id="btn-ab" onclick="openCloaked()">about:blank</button>
      <button class="hud-btn" id="btn-fs" onclick="toggleFullscreen()">Fullscreen</button>
    </div>

    <div id="gameContainer"></div>

    <div id="loader-overlay">
      <div id="loader-title">ANGRY BIRDS 2</div>
      <div id="loader-sub">WebGL Port</div>
      <div id="progress-track">
        <div id="progress-fill"></div>
      </div>
      <div id="loader-status">Initializing...</div>
      <div id="error-box"></div>
      <button id="retry-btn" onclick="location.reload()">Retry</button>
    </div>

    <script>
      const BASE_URL = new URL(".", window.location.href).href.replace(/\/$/, "");
      const BUILD_URL = BASE_URL + "/Build";
      const PART_COUNT = 6; // AngryBirds2WebPortFinal.data.unityweb.part0001 .. part0006

      const overlay = document.getElementById("loader-overlay");
      const progressFill = document.getElementById("progress-fill");
      const statusText = document.getElementById("loader-status");
      const errorBox = document.getElementById("error-box");
      const retryBtn = document.getElementById("retry-btn");
      let gameInstance = null;

      // 1. Web Audio Auto-Unlock
      (function () {
        const audioCtxs = [];
        const OrigAudioContext = window.AudioContext || window.webkitAudioContext;
        if (OrigAudioContext) {
          const PatchedAudioContext = function (opts) {
            const ctx = new OrigAudioContext(opts);
            audioCtxs.push(ctx);
            return ctx;
          };
          PatchedAudioContext.prototype = OrigAudioContext.prototype;
          window.AudioContext = PatchedAudioContext;
          if (window.webkitAudioContext) window.webkitAudioContext = PatchedAudioContext;

          const resumeAll = () => {
            audioCtxs.forEach((c) => {
              if (c && c.state === "suspended") c.resume().catch(() => {});
            });
          };
          window.addEventListener("pointerdown", resumeAll, { passive: true });
          window.addEventListener("keydown", resumeAll, { passive: true });
        }
      })();

      // 2. Pointer Lock Error Guard
      (function () {
        const origLock = Element.prototype.requestPointerLock || function () {};
        Element.prototype.requestPointerLock = function () {
          try {
            const res = origLock.apply(this, arguments);
            if (res && typeof res.catch === "function") res.catch(() => {});
            return res;
          } catch (e) {}
        };
      })();

      // 3. HUD Controls (about:blank Cloaker & Fullscreen)
      function openCloaked() {
        const btn = document.getElementById("btn-ab");
        const win = window.open("about:blank", "_blank");
        if (!win || win.closed) {
          btn.textContent = "Allow Popups!";
          setTimeout(() => { btn.textContent = "about:blank"; }, 3000);
          return;
        }
        const clone = document.documentElement.cloneNode(true);
        const ab = clone.querySelector("#btn-ab");
        if (ab) ab.remove();

        const head = clone.querySelector("head");
        if (head) {
          const base = document.createElement("base");
          base.href = BASE_URL + "/";
          head.insertBefore(base, head.firstChild);
        }

        win.document.open();
        win.document.write("<!DOCTYPE html>\n" + clone.outerHTML);
        win.document.close();
      }

      function toggleFullscreen() {
        if (gameInstance && typeof gameInstance.SetFullscreen === "function") {
          gameInstance.SetFullscreen(1);
          return;
        }
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      function showError(msg) {
        errorBox.style.display = "block";
        errorBox.textContent = msg;
        retryBtn.style.display = "inline-block";
      }

      function forceFill() {
        const c = document.querySelector("#gameContainer canvas");
        if (!c) return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        if (c.width !== w) c.width = w;
        if (c.height !== h) c.height = h;
      }
      window.addEventListener("resize", forceFill);

      // 4. Parallel 4-Digit Padded Data Chunk Fetcher & Build JSON Patcher
      async function buildPatchedConfigBlobUrl() {
        let completed = 0;
        const partPromises = [];

        for (let i = 1; i <= PART_COUNT; i++) {
          const suffix = String(i).padStart(4, "0");
          const partName = `AngryBirds2WebPortFinal.data.unityweb.part${suffix}`;
          partPromises.push(
            fetch(`${BUILD_URL}/${partName}`).then(async (res) => {
              if (!res.ok) throw new Error(`Chunk part${suffix} failed (HTTP ${res.status})`);
              const buf = await res.arrayBuffer();
              completed++;
              progressFill.style.width = `${(completed / PART_COUNT) * 65}%`;
              statusText.textContent = `Downloading game data (${completed}/${PART_COUNT})...`;
              return buf;
            })
          );
        }

        const [jsonRes, ...buffers] = await Promise.all([
          fetch(`${BUILD_URL}/AngryBirds2WebPortFinal.json`),
          ...partPromises
        ]);
        if (!jsonRes.ok) throw new Error(`Failed to fetch build JSON (HTTP ${jsonRes.status})`);

        const mergedDataBlobUrl = URL.createObjectURL(new Blob(buffers, { type: "application/octet-stream" }));
        const buildConfig = await jsonRes.json();

        buildConfig.dataUrl = mergedDataBlobUrl;
        if (buildConfig.wasmCodeUrl && !/^(https?:|blob:)/i.test(buildConfig.wasmCodeUrl)) {
          buildConfig.wasmCodeUrl = `${BUILD_URL}/${buildConfig.wasmCodeUrl.replace(/^Build\//, "")}`;
        }
        if (buildConfig.wasmFrameworkUrl && !/^(https?:|blob:)/i.test(buildConfig.wasmFrameworkUrl)) {
          buildConfig.wasmFrameworkUrl = `${BUILD_URL}/${buildConfig.wasmFrameworkUrl.replace(/^Build\//, "")}`;
        }

        const configBlobUrl = URL.createObjectURL(
          new Blob([JSON.stringify(buildConfig)], { type: "application/json" })
        );
        return { configBlobUrl, mergedDataBlobUrl };
      }

      // 5. Boot Legacy UnityLoader
      (async function boot() {
        try {
          statusText.textContent = `Downloading game data (0/${PART_COUNT})...`;
          const { configBlobUrl, mergedDataBlobUrl } = await buildPatchedConfigBlobUrl();

          statusText.textContent = "Loading Unity runtime...";
          progressFill.style.width = "70%";

          const loaderScript = document.createElement("script");
          loaderScript.src = `${BUILD_URL}/UnityLoader.js`;
          loaderScript.onload = () => {
            gameInstance = UnityLoader.instantiate("gameContainer", configBlobUrl, {
              onProgress: (instance, progress) => {
                const pct = Math.round(70 + progress * 30);
                progressFill.style.width = `${pct}%`;
                statusText.textContent = `Starting WebGL engine (${pct}%)...`;
                if (progress === 1) {
                  setTimeout(() => {
                    URL.revokeObjectURL(configBlobUrl);
                    URL.revokeObjectURL(mergedDataBlobUrl);
                    overlay.style.opacity = "0";
                    setTimeout(() => overlay.remove(), 350);
                    forceFill();
                    const c = document.querySelector("#gameContainer canvas");
                    if (c) c.focus();
                  }, 300);
                }
              }
            });
          };
          loaderScript.onerror = () => showError("Failed to load Build/UnityLoader.js.");
          document.body.appendChild(loaderScript);
        } catch (err) {
          showError(err.message || String(err));
        }
      })();
    </script>
  </body>
</html>
